<!DOCTYPE html>
<html>
<head>
    <title>Secure File Upload Portal</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* Animated Cyber Lines */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(0,255,255,0.05) 0px,
                rgba(0,255,255,0.05) 2px,
                transparent 2px,
                transparent 40px
            );
            animation: moveGrid 15s linear infinite;
        }

        @keyframes moveGrid {
            from { transform: translateY(0); }
            to { transform: translateY(-100px); }
        }

        .card {
            position: relative;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            padding: 60px;
            border-radius: 20px;
            width: 550px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,255,255,0.5);
            border: 2px solid rgba(0,255,255,0.4);
            z-index: 2;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {opacity:0; transform: scale(0.9);}
            to {opacity:1; transform: scale(1);}
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        input[type="file"] {
            margin-bottom: 20px;
            font-size: 16px;
        }

        button {
            background: linear-gradient(45deg, #00f5ff, #00ffcc);
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ffcc;
        }

        .progress-container {
            width: 100%;
            background: #444;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            height: 12px;
            width: 0%;
            background: #00ffcc;
            border-radius: 8px;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .success { color: #00ff99; }
        .error { color: #ff4d4d; }

        a {
            display: block;
            margin-top: 25px;
            font-size: 18px;
            color: #00f5ff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-shadow: 0 0 8px #00ffcc;
        }

        /* Decorative corner glow */
        .corner {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px solid #00ffcc;
        }

        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    </style>
</head>
<body>

<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<div class="card">
    <h1>🔐 SECURE FILE UPLOAD PORTAL</h1>

    <form id="uploadForm" method="POST" enctype="multipart/form-data">
        <input type="file" name="file"><br>
        <button type="submit">UPLOAD FILE</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    {% if message %}
        <p class="message {% if 'not allowed' in message or 'exceeds' in message %}error{% else %}success{% endif %}">
            {{ message }}
        </p>
    {% endif %}

    <a href="/admin">📊 VIEW SECURITY LOGS</a>
</div>

<script>
document.getElementById("uploadForm").addEventListener("submit", function() {
    let progress = document.getElementById("progressContainer");
    let bar = document.getElementById("progressBar");
    progress.style.display = "block";
    let width = 0;
    let interval = setInterval(function() {
        if (width >= 100) clearInterval(interval);
        else {
            width += 8;
            bar.style.width = width + "%";
        }
    }, 40);
});
</script>

</body>
</html>
